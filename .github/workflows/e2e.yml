# Installs every component on kind, one node for single-node and three for
# multi-node: dependencies first, smoke test, idle memory and CPU, uninstall,
# residue check, and an upgrade from the latest release when its version
# differs. Runs on amd64; local runs on Apple Silicon cover arm64.
name: e2e

on:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: list
        run: echo "matrix=$(go run ./tools/cmd/recs list)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix).include }}
    name: ${{ matrix.profile }} ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - name: Create kind cluster
        run: |
          nix develop -c kind create cluster --wait 5m \
            --image 'kindest/node:${{ fromJSON(needs.matrix.outputs.matrix).version }}' \
            $([ '${{ matrix.profile }}' = multi-node ] && echo --config .github/kind.yaml)
      - name: Previous release (upgrade test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern index.json --output previous.json || true
      - name: e2e
        run: |
          nix develop -c go run ./tools/cmd/recs e2e -profile '${{ matrix.profile }}' -write \
            $([ -f previous.json ] && echo -previous previous.json) '${{ matrix.component }}'
      - id: name
        run: echo "name=$(echo '${{ matrix.profile }}-${{ matrix.component }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measurements-${{ steps.name.outputs.name }}
          path: measurements/
          if-no-files-found: ignore

  budget:
    needs: e2e
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measurements-single-node-*
          path: measurements/
          merge-multiple: true
      - run: go run ./tools/cmd/recs budget
