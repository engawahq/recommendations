displayName: Traefik Proxy
homepage: https://traefik.io/traefik/
license: MIT
maturity: independent
rationale: >
  Serves Gateway API and Ingress, and hosts the CrowdSec bouncer. Ingress NGINX
  is retired (2026-03).
alternatives:
  envoy-gateway: Envoy-based Gateway API; reused when already installed.
defaults:
  single-node: recommended
  multi-node: recommended
disruptsTraffic: true

releases:
  - name: gateway-api-crds
    namespace: kube-system
    # Traefik v3.7.14 targets Gateway API v1.6.2; the chart lacks these CRDs.
    skipIfPresent: [httproutes.gateway.networking.k8s.io]
    urls:
      - https://github.com/kubernetes-sigs/gateway-api/releases/download/{version}/standard-install.yaml
    version: v1.6.2

  - name: traefik
    namespace: traefik
    chart: oci://ghcr.io/traefik/helm/traefik
    version: 41.7.1
    values: |
      providers:
        kubernetesGateway:
          # Route web services with HTTPRoute.
          enabled: true
        kubernetesIngress:
          # Many charts still ship Ingress objects.
          enabled: true
        kubernetesCRD:
          # Middleware objects, such as the CrowdSec bouncer.
          enabled: true
          # No references to other namespaces.
          allowCrossNamespace: false
      gatewayClass:
        # Gateways reference GatewayClass "traefik".
        enabled: true
        name: traefik
      gateway:
        # Gateways and listeners are created per domain, not by the chart.
        enabled: false
      api:
        # Unauthenticated surface; not needed.
        dashboard: false
      accessLog:
        # JSON access logs for metrics, log search and CrowdSec.
        enabled: true
        format: json
        fields:
          # Keep only the fields below; secrets live in headers and queries.
          defaultMode: drop
          names:
            RequestHost: keep
            RequestMethod: keep
            RequestPath: keep
            RequestProtocol: keep
            DownstreamStatus: keep
            DownstreamContentSize: keep
            RequestContentSize: keep
            Duration: keep
            RouterName: keep
            StartUTC: keep
          headers:
            # Headers carry cookies and bearer tokens.
            defaultMode: drop
          queryParameters:
            # Query strings carry OAuth codes and signed-URL secrets.
            defaultMode: drop
    profiles:
      single-node: |
        deployment:
          # A second copy gains nothing on one node.
          replicas: 1
        resources:
          # Idles near 40Mi; the limit contains leaks.
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
      multi-node: |
        deployment:
          # Survive a node drain.
          replicas: 2
        podDisruptionBudget:
          # Keep one replica up during disruptions.
          enabled: true
          minAvailable: 1
        topologySpreadConstraints:
          # One replica per node where possible.
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
        metrics:
          prometheus:
            # Request rate and latency metrics.
            service:
              enabled: true
        resources:
          # Headroom for higher request rates.
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}

detection:
  gatewayControllers: [traefik.io/gateway-controller]
  ingressControllers: [traefik.io/ingress-controller]
  crds: [ingressroutes.traefik.io, middlewares.traefik.io]
  helmCharts: [traefik]
  k3sAddons: [traefik]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: traefik}
    - kind: DaemonSet
      labels: {app.kubernetes.io/name: traefik}

security:
  summary: Reads Services, Secrets and routes cluster-wide; writes route status.
  clusterWide: true
  tenants: namespaced
  tenantCRDs: [HTTPRoute, GRPCRoute]
  risks:
    - risk: A tenant HTTPRoute can claim another tenant's hostname on a shared listener.
      mitigation: One listener per verified domain, allowedRoutes limited to its namespace.
    - risk: Traefik CRDs can reference other namespaces.
      mitigation: allowCrossNamespace is false and tenants get no Traefik CRDs.

leftovers: [customresourcedefinitions]

smoke:
  - name: gateway-class-accepted
    wait: ["gatewayclass/traefik --for=condition=Accepted"]
